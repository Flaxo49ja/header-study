name: Weekly header scan

# Re-runs the scan → analyze → report pipeline on a schedule.
#
# Refreshed results are pushed to the `auto-scan` branch, NOT to main:
# main holds the authoritative Maputo/Teledata snapshot that the paper
# cites, and CI runners sit in Azure datacenters, so a weekly run from
# there must not silently overwrite those numbers. The `auto-scan`
# branch always holds the latest CI snapshot for comparison.

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC (off the top-of-hour rush)
  workflow_dispatch: {} # manual trigger from the Actions tab

permissions:
  contents: write # the default token needs write access to push results

concurrency:
  group: header-scan
  cancel-in-progress: false # never kill a scan halfway through

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan → analyze → report
        run: |
          python scanner/scan.py
          python scanner/analyze.py
          python scanner/report.py --location "GitHub Actions runner (scheduled re-scan)"

      - name: Push snapshot to auto-scan branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No changes in results — nothing to commit."
            exit 0
          fi
          git commit -m "chore(results): scheduled re-scan $(date -u +%Y-%m-%d)"
          git push origin HEAD:auto-scan --force
